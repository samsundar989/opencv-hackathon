[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riversight"
version = "0.1.0"
description = "RiverSight: public river webcams as self-calibrating water-level instruments (OpenCV 5 + AWS)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "opencv-python-headless==5.0.0.93",   # PINNED. Do not float: 5.1 renames DNN engine enums.
  "numpy>=2.0,<3",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "onnxruntime>=1.18",                  # only for diffing ONNX models against cv2.dnn
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "mypy>=1.10"]
train = ["torch", "torchvision", "segmentation-models-pytorch", "onnx", "onnxsim"]   # install torch per CUDA docs for the 5090
aws = ["boto3>=1.34", "aws-cdk-lib>=2.150", "constructs>=10", "strands-agents"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[project.scripts]
riversight = "riversight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
